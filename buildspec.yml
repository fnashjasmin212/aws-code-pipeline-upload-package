version: 0.2

env:
  variables:
    # Default values (can be overridden in CodeBuild)
    BASE_URL: "https://toro288.ws.martiniserver.com/"
    PACKAGE_NAME_PATTERN: "^(new-package)$"
  
  secrets-manager:
    MARTINI_ACCESS_TOKEN: MARTINI_ACCESS_TOKEN

phases:
  pre_build:
    commands:
      # Validate required variables
      - |
        missing=0
        for var in BASE_URL MARTINI_ACCESS_TOKEN; do
          if [ -z "${!var}" ]; then
            echo "ERROR: $var is missing"
            missing=1
          fi
        done
        if [ "$missing" = "1" ]; then exit 1; fi
      
      - echo "Configuration:"
      - echo "  BASE_URL=$BASE_URL"
      - echo "  PACKAGE_NAME_PATTERN=$PACKAGE_NAME_PATTERN"
  build:
    commands:
      # Download the latest upload script from source
      - curl -L https://raw.githubusercontent.com/lontiplatform/martini-build-pipeline-aws/ad701334d1a079c64a4a61a9d67b27b0e4cf7aaf/terraform/scripts/upload_packages.sh -o upload_packages.sh
      - chmod +x upload_packages.sh
      - bash upload_packages.sh

artifacts:
  files:
    - '**/packages.zip'
    - '**/response_body.log'
    - '**/results.log'
  discard-paths: true
